<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- your computer -->
  <rect x="10" y="70" width="150" height="110" rx="10" fill="#eef3f9" stroke="#2f5d8c" stroke-width="1.5"/>
  <text x="85" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5d8c">Your computer</text>
  <rect x="35" y="112" width="100" height="50" rx="4" fill="#2b2b2b"/>
  <text x="44" y="132" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#7fd67f">$ ssh ...</text>
  <text x="44" y="150" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#7fd67f">$ scp ...</text>

  <!-- ssh arrow -->
  <line x1="162" y1="125" x2="248" y2="125" stroke="#555" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="205" y="115" text-anchor="middle" font-size="13" fill="#333">ssh, scp,</text>
  <text x="205" y="145" text-anchor="middle" font-size="13" fill="#333">rsync</text>

  <!-- cluster boundary -->
  <rect x="235" y="10" width="515" height="310" rx="14" fill="none" stroke="#9d2235" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="32" text-anchor="end" font-size="14" font-weight="700" fill="#9d2235">The cluster (AHPCC)</text>

  <!-- login node -->
  <rect x="255" y="70" width="160" height="110" rx="10" fill="#f7ecee" stroke="#9d2235" stroke-width="1.5"/>
  <text x="335" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#9d2235">Login node</text>
  <text x="335" y="118" text-anchor="middle" font-size="12" fill="#555">hpc-portal2</text>
  <text x="335" y="142" text-anchor="middle" font-size="13" fill="#333">edit files, move data,</text>
  <text x="335" y="160" text-anchor="middle" font-size="13" fill="#333">submit jobs</text>

  <!-- sbatch arrow -->
  <line x1="417" y1="125" x2="508" y2="125" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="115" text-anchor="middle" font-size="13" font-family="JetBrains Mono, Menlo, monospace" fill="#333">sbatch</text>
  <text x="462" y="145" text-anchor="middle" font-size="12" fill="#555">SLURM queue</text>

  <!-- compute nodes -->
  <rect x="510" y="50" width="225" height="150" rx="10" fill="#eef7f0" stroke="#2f7d46" stroke-width="1.5"/>
  <text x="622" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#2f7d46">Compute nodes</text>
  <g fill="#fff" stroke="#2f7d46" stroke-width="1.2">
    <rect x="528" y="88" width="55" height="30" rx="4"/>
    <rect x="595" y="88" width="55" height="30" rx="4"/>
    <rect x="662" y="88" width="55" height="30" rx="4"/>
    <rect x="528" y="128" width="55" height="30" rx="4"/>
    <rect x="595" y="128" width="55" height="30" rx="4"/>
    <rect x="662" y="128" width="55" height="30" rx="4"/>
  </g>
  <text x="622" y="186" text-anchor="middle" font-size="13" fill="#333">your jobs run here (+ /scratch)</text>

  <!-- shared storage -->
  <path d="M255,255 a15,8 0 0,1 0,0 L255,295 Q492,315 735,295 L735,255" fill="#fff8e6" stroke="#9a6b00" stroke-width="1.5"/>
  <ellipse cx="495" cy="255" rx="240" ry="14" fill="#fff8e6" stroke="#9a6b00" stroke-width="1.5"/>
  <text x="495" y="287" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6b00">Shared storage:  /home  ·  /storage</text>

  <!-- connections to storage -->
  <line x1="335" y1="182" x2="335" y2="240" stroke="#9a6b00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="622" y1="202" x2="622" y2="240" stroke="#9a6b00" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
