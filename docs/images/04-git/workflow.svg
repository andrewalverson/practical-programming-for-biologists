<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 250" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- your computer boundary -->
  <rect x="5" y="5" width="620" height="240" rx="14" fill="none" stroke="#2f5d8c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="27" font-size="14" font-weight="700" fill="#2f5d8c">Your computer</text>

  <!-- working directory -->
  <rect x="20" y="45" width="210" height="185" rx="10" fill="#fff" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="125" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2b2b">Working directory</text>
  <rect x="32" y="82" width="88" height="136" rx="6" fill="#fdf1ef" stroke="#b3261e" stroke-width="1"/>
  <text x="76" y="170" text-anchor="middle" font-size="13" fill="#b3261e">untracked</text>
  <text x="76" y="186" text-anchor="middle" font-size="13" fill="#b3261e">files</text>
  <rect x="130" y="82" width="88" height="136" rx="6" fill="#eef7f0" stroke="#2f7d46" stroke-width="1"/>
  <text x="174" y="170" text-anchor="middle" font-size="13" fill="#2f7d46">tracked</text>
  <text x="174" y="186" text-anchor="middle" font-size="13" fill="#2f7d46">files</text>
  <line x1="90" y1="128" x2="162" y2="128" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="98" y="100" width="56" height="17" rx="3" fill="#fff"/>
  <text x="126" y="113" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#333">git add</text>

  <!-- staging area -->
  <rect x="320" y="80" width="105" height="115" rx="10" fill="#fff8e6" stroke="#9a6b00" stroke-width="1.5"/>
  <text x="372" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#9a6b00">Staging</text>
  <text x="372" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#9a6b00">area</text>

  <!-- local repo -->
  <rect x="510" y="80" width="105" height="115" rx="10" fill="#f7ecee" stroke="#9d2235" stroke-width="1.5"/>
  <text x="562" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#9d2235">Local</text>
  <text x="562" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#9d2235">repository</text>
  <text x="562" y="175" text-anchor="middle" font-size="11" font-family="JetBrains Mono, Menlo, monospace" fill="#6b6b6b">.git/</text>

  <!-- remote -->
  <rect x="710" y="80" width="112" height="115" rx="10" fill="#eef3f9" stroke="#2f5d8c" stroke-width="1.5"/>
  <text x="766" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5d8c">Remote</text>
  <text x="766" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5d8c">repository</text>
  <text x="766" y="168" text-anchor="middle" font-size="12" fill="#555">(GitHub)</text>

  <!-- arrows -->
  <line x1="232" y1="125" x2="317" y2="125" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="115" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#333">git add</text>
  <line x1="317" y1="155" x2="232" y2="155" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="275" y="173" text-anchor="middle" font-size="10" font-family="JetBrains Mono, Menlo, monospace" fill="#777">git restore</text>
  <text x="275" y="185" text-anchor="middle" font-size="10" font-family="JetBrains Mono, Menlo, monospace" fill="#777">--staged</text>

  <line x1="427" y1="137" x2="527" y2="137" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="467" y="127" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#333">git commit</text>

  <line x1="617" y1="112" x2="707" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="102" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#333">git push</text>
  <line x1="707" y1="165" x2="617" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="184" text-anchor="middle" font-size="12" font-family="JetBrains Mono, Menlo, monospace" fill="#333">git pull</text>
</svg>
